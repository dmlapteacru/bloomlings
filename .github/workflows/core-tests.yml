name: core-tests

# Manual only for now (Actions → Run workflow), so pushes and pull requests spend no Actions minutes; the tests are run
# locally before each push (CLAUDE.md "Build and test commands"). Restore the push and pull_request triggers when the
# budget allows.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: core/global.json

      - name: Build
        run: dotnet build core/Bloomlings.sln -c Release

      - name: Test
        run: dotnet test core/Bloomlings.sln -c Release --no-build --logger trx --results-directory core/artifacts/test-results

      - name: Client scripts (stub compile and engine-free EditMode tests)
        run: dotnet test client/DotnetCheck/Bloomlings.Client.DotnetCheck.csproj -c Release --logger trx --results-directory core/artifacts/test-results

      - name: Cloud Code scripts (in-memory UGS stand-ins)
        run: node --test backend/tests/*.test.js

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/artifacts/test-results
          retention-days: 3
