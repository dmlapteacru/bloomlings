name: core-tests

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: core/global.json

      - name: Build
        run: dotnet build core/Bloomlings.sln -c Release

      - name: Test
        run: dotnet test core/Bloomlings.sln -c Release --no-build --logger trx --results-directory core/artifacts/test-results

      - name: Client scripts (stub compile and engine-free EditMode tests)
        run: dotnet test client/DotnetCheck/Bloomlings.Client.DotnetCheck.csproj -c Release --logger trx --results-directory core/artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/artifacts/test-results
