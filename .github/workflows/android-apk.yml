name: android-apk

# Builds the temporary playtest APKs (.NET for Android on the shared C# core, Levels 1–94) and uploads them as
# artifacts. They need no secrets: the .NET Android workload and the runner's Android SDK are free.
#   - bloomlings-playtest-apk (playtest/android): the full playtest, with Home, progression, economy, demos, animations;
#   - bloomlings-tester-apk (playtest/tester): the level tester, with ◀ ▶ between levels, free boosters, instant results.
# The two install side by side (different application ids). Both are signed with the fixed playtest key from the
# repository secrets (see "Build the APK"), so each new build installs over the last one as an update.
# Manual only (Actions → android-apk → Run workflow): it never runs on push, pull request or a schedule, so commits
# spend no Actions minutes. Only the newest APK of each kind is kept: after a successful upload every older artifact
# with the same name is deleted, and each artifact also expires after 7 days.

on:
  workflow_dispatch:
    inputs:
      apks:
        description: Which APKs to build
        type: choice
        options: [both, playtest, tester]
        default: both
      architecture:
        description: CPU architecture (arm64 for most phones; universal carries all CPUs)
        type: choice
        options: [arm64, arm, x64, universal]
        default: arm64

permissions:
  contents: read
  actions: write # to delete the older APK artifacts

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        # Only the APKs the run asked for (no runner starts for the other one).
        include: ${{ fromJSON(inputs.apks == 'playtest' && '[{"kind":"playtest","project":"playtest/android","artifact":"bloomlings-playtest-apk"}]' || inputs.apks == 'tester' && '[{"kind":"tester","project":"playtest/tester","artifact":"bloomlings-tester-apk"}]' || '[{"kind":"playtest","project":"playtest/android","artifact":"bloomlings-playtest-apk"},{"kind":"tester","project":"playtest/tester","artifact":"bloomlings-tester-apk"}]') }}
    env:
      ARTIFACT: ${{ matrix.artifact }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      APK_RUNTIME: ${{ inputs.architecture == 'arm' && 'android-arm' || inputs.architecture == 'x64' && 'android-x64' || inputs.architecture == 'universal' && 'android-arm64;android-arm;android-x64' || 'android-arm64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: core/global.json

      - name: Install the .NET Android workload
        working-directory: ${{ matrix.project }}
        run: dotnet workload install android

      - name: Install missing Android SDK packages
        working-directory: ${{ matrix.project }}
        run: dotnet build -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Build the APK
        # Single CPU by default; universal remains an explicit choice. Output names stay unchanged.
        # Signing: both APKs are signed with the playtest key from the repository secrets PLAYTEST_KEYSTORE_BASE64 (the
        # PKCS12 keystore, base64) and PLAYTEST_KEYSTORE_PASSWORD (alias bloomlings-playtest), so a new APK installs over
        # the previous one as an update. The key never goes into the repository (it is public). Without the secrets the
        # build falls back to a fresh debug key, and that APK cannot update an installed one.
        working-directory: ${{ matrix.project }}
        env:
          PLAYTEST_KEYSTORE_BASE64: ${{ secrets.PLAYTEST_KEYSTORE_BASE64 }}
          PLAYTEST_KEYSTORE_PASSWORD: ${{ secrets.PLAYTEST_KEYSTORE_PASSWORD }}
        run: |
          build_code=$(date -u +%s)
          build_label="0.1.0-${GITHUB_SHA:0:8}"
          echo "Building commit $GITHUB_SHA ($build_label)"
          sign=()
          if [ -n "$PLAYTEST_KEYSTORE_BASE64" ] && [ -n "$PLAYTEST_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$PLAYTEST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/playtest.keystore"
            sign=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/playtest.keystore"
                  -p:AndroidSigningKeyAlias=bloomlings-playtest
                  -p:AndroidSigningStorePass=env:PLAYTEST_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:PLAYTEST_KEYSTORE_PASSWORD)
            echo "Signing with the playtest key."
          else
            echo "::warning::No PLAYTEST_KEYSTORE_BASE64 / PLAYTEST_KEYSTORE_PASSWORD secrets: signed with a fresh debug key, so this APK cannot update an installed one."
          fi
          dotnet publish -c Release -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:RuntimeIdentifiers="$APK_RUNTIME" -p:AndroidCreatePackagePerAbi=false -p:ApplicationVersion="$build_code" -p:ApplicationDisplayVersion="$build_label" "${sign[@]}"
          rm -f "$RUNNER_TEMP/playtest.keystore"
          for apk in bin/Release/net10.0-android/*-Signed.apk; do
            echo "Signing certificate of $apk:"
            apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
            [ -n "$apksigner" ] && "$apksigner" verify --print-certs "$apk" | grep -E "DN:|SHA-256" || true
          done

      - name: Report APK size by assets and CPU
        run: |
          for apk in "${{ matrix.project }}"/bin/Release/net10.0-android/*-Signed.apk; do
            python3 tools/assetpack/apk-size.py "$apk"
          done

      # `dotnet publish` signs the APK in bin/Release/net10.0-android/ and copies it into its publish/ folder: only the
      # first is uploaded (a recursive pattern took both, the same APK twice).
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ matrix.project }}/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Delete older APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=100" \
            --jq ".artifacts[] | select(.id != ${KEEP}) | .id" |
          while read -r id; do
            echo "Deleting artifact ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
