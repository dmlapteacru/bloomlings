name: content-validate

# Gates content changes on pull requests (T093, contracts/pipeline-cli.md "CI usage"): the picture library, the
# changed levels (FR-080, FR-081; FR-083 still covers the whole catalog) and deliberate definitionVersion bumps (FR-076).
# Manual only for now (Actions → Run workflow), so pull requests spend no Actions minutes; `validate` is run locally
# before content is pushed. Restore the pull_request trigger (paths content/**, core/**) when the budget allows.
on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch to compare against (changed levels, unversioned changes)
        type: string
        default: main

env:
  BASE_REF: ${{ github.base_ref || inputs.base }}

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: core/global.json

      - name: Build the pipeline
        run: dotnet build core/src/Bloomlings.Pipeline -c Release

      - name: Pictures
        run: dotnet run --project core/src/Bloomlings.Pipeline -c Release --no-build -- pictures validate --lib content/pictures/lib

      - name: Curated levels
        run: dotnet run --project core/src/Bloomlings.Pipeline -c Release --no-build -- validate --defs content/curated

      - name: Changed catalog levels
        run: >
          dotnet run --project core/src/Bloomlings.Pipeline -c Release --no-build --
          validate --defs content/catalog --context content/curated --changed-only --base "origin/${{ env.BASE_REF }}"

      # FR-076: a shipped level or picture changes only with a version bump (curated levels ship too).
      - name: Unversioned changes (catalog and pictures)
        run: >
          dotnet run --project core/src/Bloomlings.Pipeline -c Release --no-build --
          diff --from "origin/${{ env.BASE_REF }}" --to content/catalog

      - name: Unversioned changes (curated levels)
        run: >
          dotnet run --project core/src/Bloomlings.Pipeline -c Release --no-build --
          diff --from "origin/${{ env.BASE_REF }}" --to content/curated
