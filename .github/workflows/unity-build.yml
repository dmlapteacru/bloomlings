name: unity-build

# Unity EditMode tests and Android/iOS player builds with GameCI (T152).
# Needs the repository secrets UNITY_LICENSE (the .ulf contents), UNITY_EMAIL and UNITY_PASSWORD, and a Unity project
# that has been opened once (client/ProjectSettings/ProjectVersion.txt, T008). Until both exist the workflow only runs
# its preflight job and skips the rest, so it never fails for missing setup.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["client/**", "core/src/**", ".github/workflows/unity-build.yml"]
  pull_request:
    paths: ["client/**", "core/src/**", ".github/workflows/unity-build.yml"]

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -f client/ProjectSettings/ProjectVersion.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity jobs skipped: set the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets and commit client/ProjectSettings (open the project once with Unity 6.3 LTS)."
          fi

  editmode-tests:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-editmode-${{ hashFiles('client/Packages/manifest.json', 'client/Packages/packages-lock.json') }}
          restore-keys: Library-editmode-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: auto
          testMode: editmode
          artifactsPath: editmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: editmode-results

  build:
    needs: [preflight, editmode-tests]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [Android, iOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('client/Packages/manifest.json', 'client/Packages/packages-lock.json') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-
      # Development players built from the bundled content; release builds need published content (ReleaseContentBuildStep).
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: auto
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: Bloomlings.Client.Editor.CiBuild.Build
          buildName: Bloomlings
      - uses: actions/upload-artifact@v4
        with:
          name: bloomlings-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  golden-replays:
    needs: [preflight, editmode-tests]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-Android-${{ hashFiles('client/Packages/manifest.json', 'client/Packages/packages-lock.json') }}
          restore-keys: Library-Android-
      # The IL2CPP device determinism player (T151); run it on the reference devices and compare the RESULT lines.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: auto
          targetPlatform: Android
          buildMethod: Bloomlings.Client.Editor.CiBuild.BuildGoldenReplays
          buildName: golden-replays
      - uses: actions/upload-artifact@v4
        with:
          name: golden-replays-android
          path: build/Android
