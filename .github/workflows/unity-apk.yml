name: unity-apk

# Builds the Bloomlings Android APK from the Unity client (GameCI) and uploads it as an artifact.
# For the no-secrets playtest APK, use android-apk.yml instead.
# Manual only (Actions → unity-apk → Run workflow): it never runs on push, pull request or a schedule, so commits
# spend no Actions minutes. Only the newest APK is kept: after a successful upload every older artifact with the same
# name is deleted, and each artifact also expires after 7 days.
#
# Needs the repository secrets UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (the contents of the .ulf licence file;
# for a Pro licence, UNITY_SERIAL instead of UNITY_LICENSE). See client/README.md.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options: [game, golden-replays]
        default: game
      development:
        description: Development build (Development Build watermark, script debugging)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # to delete the older APK artifacts

concurrency:
  group: unity-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARTIFACT: ${{ inputs.target == 'golden-replays' && 'bloomlings-unity-golden-replays-apk' || 'bloomlings-unity-apk' }}
    steps:
      - name: Check the Unity licence secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; }; then
            echo "::error::Add the UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE (or UNITY_SERIAL) repository secrets first."
            exit 1
          fi

      - uses: actions/checkout@v4

      # The Unity Android image is large; the runner needs the space.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: core/global.json

      # Android reads levels only from published packs. Playtest content: the curated Levels 1–10; publish validates
      # them first (the release gate), and a build with packs is a release build, so it stops after Level 10 ("More
      # levels soon") until the catalog grows. Draft pictures are packed as marked previews.
      - name: Publish playtest content
        if: inputs.target == 'game'
        run: dotnet run --project core/src/Bloomlings.Pipeline -c Release -- publish --catalog content/curated --content-version 1 --allow-draft --out build/content

      - uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-Android-${{ hashFiles('client/Packages/manifest.json', 'client/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: client
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          versioning: None
          buildName: ${{ env.ARTIFACT }}
          buildMethod: ${{ inputs.target == 'golden-replays' && 'Bloomlings.Client.Editor.CiBuild.BuildGoldenReplays' || 'Bloomlings.Client.Editor.CiBuild.Build' }}
          customParameters: ${{ inputs.development && '-bloomlingsDevelopment' || '' }}

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ env.ARTIFACT }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Delete older APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=100" \
            --jq ".artifacts[] | select(.id != ${KEEP}) | .id" |
          while read -r id; do
            echo "Deleting artifact ${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
