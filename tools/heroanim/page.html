<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The render page of bake.mjs: three.js (node_modules), the FBX loader patched by serve.mjs (embedded textures) and
     the glTF loader (.glb heroes). -->
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
</head>
<body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from '/fbxloader.js';
import { GLTFLoader } from '/three/examples/jsm/loaders/GLTFLoader.js';

// Smootherstep: the blend weight of the seams (0 → 1 with flat ends).
const smooth = x => { const t = Math.min(1, Math.max(0, x)); return t * t * t * (t * (t * 6 - 15) + 10); };

// A hero's model: an FBX (Meshy) or a glTF binary (Blender), its clips on the returned object either way. Only its
// skinned meshes are the hero: an exported scene's other meshes (Blender's default cube), lights and cameras are hidden.
async function loadHero(file) {
  let obj;
  if (file.endsWith('.glb')) {
    const gltf = await new GLTFLoader().loadAsync('/models/' + file);
    obj = gltf.scene;
    obj.animations = gltf.animations;
  } else {
    obj = await new FBXLoader().loadAsync('/models/' + file);
  }
  obj.traverse(o => { if ((o.isMesh && !o.isSkinnedMesh) || o.isLight || o.isCamera) o.visible = false; });
  const maps = [];
  obj.traverse(o => { if (o.isMesh && o.material.map) maps.push(o.material.map); });
  for (let i = 0; i < 600 && !maps.every(t => t.image && t.image.width && (t.image.complete === undefined || t.image.complete)); i++) {
    await new Promise(r => setTimeout(r, 50));
  }
  return obj;
}

// job: { file, idle, react, win, head, top, fps, idleSeconds, reactSeconds, idleBlend, reactIn, reactOut, yaw, pitch, fov,
// light, width, height }
// Renders the idle loop, the reaction and, when job.win names one, the win's celebration at job.width × job.height (the
// bake supersampling) and returns PNG data URLs with the projected head points of every frame (the hats follow them)
// and the ground point.
window.bake = async (job) => {
  const obj = await loadHero(job.file);
  const W = job.width, H = job.height;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;

  const scene = new THREE.Scene();
  const L = job.light;
  const exposure = L.exposure ?? 1, lift = L.lift ?? 0;
  // A hero's own color grade of its albedo (heroes.json `color`): gamma under 1 lightens the midtones, gain scales,
  // saturation mixes toward the pixel's grey, warm shifts red up and blue down. Applied once to the texture's pixels.
  const grade = (map, c) => {
    const img = map.image, w = img.width, h = img.height;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'); g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, w, h), px = d.data;
    const gamma = c.gamma ?? 1, gain = c.gain ?? 1, sat = c.saturation ?? 1, warm = c.warm ?? 0;
    for (let i = 0; i < px.length; i += 4) {
      let r = px[i] / 255, gg = px[i + 1] / 255, b = px[i + 2] / 255;
      r = Math.pow(r, gamma) * gain; gg = Math.pow(gg, gamma) * gain; b = Math.pow(b, gamma) * gain;
      const y = 0.2126 * r + 0.7152 * gg + 0.0722 * b;
      r = y + (r - y) * sat + warm; gg = y + (gg - y) * sat + warm * 0.3; b = y + (b - y) * sat - warm;
      px[i] = Math.max(0, Math.min(255, Math.round(r * 255)));
      px[i + 1] = Math.max(0, Math.min(255, Math.round(gg * 255)));
      px[i + 2] = Math.max(0, Math.min(255, Math.round(b * 255)));
    }
    g.putImageData(d, 0, 0);
    const t = new THREE.CanvasTexture(cv);
    t.flipY = map.flipY; t.wrapS = map.wrapS; t.wrapT = map.wrapT; t.colorSpace = THREE.SRGBColorSpace;
    return t;
  };
  obj.traverse(o => {
    if (!o.isMesh || !o.visible) return;
    let map = o.material.map;
    if (map && job.color) map = grade(map, job.color);
    if (map) map.colorSpace = THREE.SRGBColorSpace;
    // Lambert on the albedo, without the model's normal map (it shows blotches): bright, soft, volumetric. A hero's
    // light.lift adds that share of its own albedo as glow, so its shadows open up without washing out its lit side.
    o.material = new THREE.MeshLambertMaterial(lift > 0 && map
      ? { map, emissive: 0xffffff, emissiveMap: map, emissiveIntensity: lift }
      : { map });
    o.frustumCulled = false;
  });
  scene.add(obj);
  // The lights, each scaled by the hero's light.exposure (1 by default).
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0xb8a080, L.hemi * exposure));
  const key = new THREE.DirectionalLight(0xfff2dc, L.key * exposure); key.position.set(-1.2, 2.0, 2.2); scene.add(key);
  const fill = new THREE.DirectionalLight(0xe8f0ff, L.fill * exposure); fill.position.set(1.5, 0.6, 1.5); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, L.rim * exposure); rim.position.set(0.5, 1.5, -2.0); scene.add(rim);

  const mixer = new THREE.AnimationMixer(obj);
  // A clip by its Meshy id: the whole name, or its last part after "|" (the 60 fps export names them
  // "target_character|target_character|<id>").
  const clipOf = name => { const c = obj.animations.find(a => a.name === name || a.name.endsWith('|' + name)); if (!c) throw new Error('no clip ' + name + ' in ' + job.file); return c; };
  // A clip's own span: from its first keyframe (Blender's clips start at frame 1, 1/24 s in) to its last.
  const span = clip => { let a = Infinity, b = 0; for (const t of clip.tracks) { a = Math.min(a, t.times[0]); b = Math.max(b, t.times[t.times.length - 1]); } return { start: Math.min(a, b), length: b - Math.min(a, b) }; };
  const idle = clipOf(job.idle), react = clipOf(job.react), win = job.win ? clipOf(job.win) : null;
  const sIdle = span(idle), sReact = span(react), sWin = win ? span(win) : null;
  const aIdle = mixer.clipAction(idle), aRest = mixer.clipAction(idle.clone()), aReact = mixer.clipAction(react);
  const aWin = win ? mixer.clipAction(win) : null;
  for (const a of [aIdle, aRest, aReact, aWin]) { if (a) { a.play(); a.setEffectiveTimeScale(0); } }
  const rest = () => sIdle.start; // the loop's seam: the idle's first pose
  // Poses one frame: weights of the idle at t, the seam pose, the one-shot clip (the reaction, or the win's) at t.
  const pose = (wIdle, tIdle, wRest, wShot, tShot, shot) => {
    aIdle.setEffectiveWeight(wIdle); aIdle.time = tIdle;
    aRest.setEffectiveWeight(wRest); aRest.time = rest();
    aReact.setEffectiveWeight(shot === aReact ? wShot : 0); aReact.time = shot === aReact ? tShot : 0;
    if (aWin) { aWin.setEffectiveWeight(shot === aWin ? wShot : 0); aWin.time = shot === aWin ? tShot : 0; }
    mixer.update(0);
    obj.updateMatrixWorld(true);
  };

  // Each clip lasts job.idleSeconds and job.reactSeconds on screen (the owner's table for the Meshy heroes: 4 s and 2 s),
  // whatever the time its file stamps on its keyframes (the 60 fps export puts the same frames 1/60 s apart, 2.5 times
  // faster); without them, and for the win's clip, its own span: t is the time on screen, start + t * k the clip's own.
  const idleLength = job.idleSeconds || sIdle.length, kIdle = sIdle.length / idleLength;
  const reactLength = job.reactSeconds || sReact.length, kReact = sReact.length / reactLength;

  // The idle loop: the clip, eased into its own first pose over the last idleBlend seconds, so it loops seamlessly.
  const frames = [];
  const nIdle = Math.round(idleLength * job.fps);
  for (let i = 0; i < nIdle; i++) {
    const t = idleLength * i / nIdle;
    const w = smooth((t - (idleLength - job.idleBlend)) / job.idleBlend);
    frames.push({ clip: 'idle', set: () => pose(1 - w, sIdle.start + (t * kIdle), w, 0, 0, null) });
  }
  // The reaction: from the seam pose into the clip over reactIn seconds and back to the seam pose over the last
  // reactOut seconds, so it starts and ends where the idle loop starts.
  // The win's celebration likewise, from the seam pose and back to it.
  const shot = (name, action, s, length, k) => {
    const n = Math.round(length * job.fps);
    for (let i = 0; i < n; i++) { // the last pose is the seam: the idle's first frame shows it
      const t = length * i / n;
      const w = Math.max(1 - smooth(t / job.reactIn), smooth((t - (length - job.reactOut)) / job.reactOut));
      frames.push({ clip: name, set: () => pose(0, 0, w, 1 - w, s.start + (t * k), action) });
    }
  };
  shot('react', aReact, sReact, reactLength, kReact);
  if (aWin) shot('win', aWin, sWin, sWin.length, 1);

  // One camera for every frame: the union of the posed bounds, seen from the yaw and the pitch.
  const box = new THREE.Box3();
  const bounds = () => { const b = new THREE.Box3(); obj.traverse(o => { if (o.isSkinnedMesh && o.visible) b.union(new THREE.Box3().setFromObject(o, true)); }); return b; };
  for (const f of frames) { f.set(); box.union(bounds()); }
  const fov = job.fov, yaw = job.yaw * Math.PI / 180, pitch = job.pitch * Math.PI / 180;
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  // The near and far planes from the model's size (Meshy's models are in centimetres, Blender's in metres).
  const camera = new THREE.PerspectiveCamera(fov, W / H, size.length() / 1000, size.length() * 100);
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  const tan = Math.tan(fov * Math.PI / 360);
  const radius = Math.max(size.y / 2 / tan, size.x / 2 / tan / (W / H), size.z / 2 / tan) * 1.25 + size.length() / 2;
  camera.position.copy(c).addScaledVector(dir, radius);
  camera.lookAt(c);
  camera.updateMatrixWorld(true);

  const bone = name => { let b = null; obj.traverse(o => { if (o.isBone && o.name === name) b = o; }); return b; };
  const head = bone(job.head || 'mixamorigHead'), top = bone(job.top || 'mixamorigHeadTop_End');
  if (!head || !top) throw new Error('no head bones ' + (job.head || 'mixamorigHead') + ', ' + (job.top || 'mixamorigHeadTop_End') + ' in ' + job.file);
  const project = o => { const v = o.getWorldPosition(new THREE.Vector3()).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
  const ground = new THREE.Vector3(0, 0, 0).project(camera);

  // Pass 1: the union of every frame's opaque bounds and the idle's foot line (its lowest solid row at the seam).
  const gl = renderer.getContext();
  const pixels = new Uint8Array(W * H * 4);
  let minX = W, minY = H, maxX = -1, maxY = -1, feet = -1;
  frames.forEach((f, i) => {
    f.set();
    renderer.render(scene, camera);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    for (let y = 0; y < H; y++) {
      const row = (H - 1 - y) * W * 4; // readPixels starts at the bottom
      for (let x = 0; x < W; x++) {
        const a = pixels[row + x * 4 + 3];
        if (a === 0) continue;
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (i === 0 && a >= 128 && y > feet) feet = y;
      }
    }
  });

  // The fit: the hero's ground point at the cell's middle, its seam pose's feet on the foot line, as large as the
  // union of all frames allows inside the margins, its seam pose at most job.fill of the cell high.
  const CW = job.cell[0], CH = job.cell[1], footLine = job.feet * CH, m = job.margin;
  const gx = (ground.x + 1) / 2 * W;
  let seamTop = H;
  { frames[0].set(); renderer.render(scene, camera); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    for (let y = 0; y < H && seamTop === H; y++) { const row = (H - 1 - y) * W * 4; for (let x = 0; x < W; x++) if (pixels[row + x * 4 + 3] > 0) { seamTop = y; break; } } }
  const s = Math.min(
    job.fill * CH / (feet - seamTop),
    (footLine - m * CH) / (feet - minY),
    ((1 - m) * CH - footLine) / Math.max(1, maxY - feet),
    (CW / 2 - m * CW) / Math.max(1, gx - minX),
    (CW / 2 - m * CW) / Math.max(1, maxX - gx));
  const tx = CW / 2 - s * gx, ty = footLine - s * feet;
  const cell = document.createElement('canvas'); cell.width = CW; cell.height = CH;
  const g = cell.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  const toCell = p => [+(p[0] * s + tx).toFixed(2), +(p[1] * s + ty).toFixed(2)];

  // Pass 2: every frame drawn into the cell.
  const out = [];
  for (const f of frames) {
    f.set();
    renderer.render(scene, camera);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, CW, CH);
    g.setTransform(s, 0, 0, s, tx, ty);
    g.drawImage(renderer.domElement, 0, 0);
    out.push({ clip: f.clip, png: cell.toDataURL('image/png'), head: toCell(project(head)), top: toCell(project(top)) });
  }
  renderer.dispose();
  return { frames: out, scale: s, render: [W, H], idleSeconds: idleLength, reactSeconds: reactLength, winSeconds: sWin ? sWin.length : 0 };
};
window.ready = true;
</script>
</body>
</html>
