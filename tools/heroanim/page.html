<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The render page of bake.mjs: three.js (node_modules) and the FBX loader patched by serve.mjs (embedded textures). -->
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
</head>
<body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from '/fbxloader.js';

// Smootherstep: the blend weight of the seams (0 → 1 with flat ends).
const smooth = x => { const t = Math.min(1, Math.max(0, x)); return t * t * t * (t * (t * 6 - 15) + 10); };

async function loadHero(file) {
  const obj = await new FBXLoader().loadAsync('/models/' + file);
  const maps = [];
  obj.traverse(o => { if (o.isMesh && o.material.map) maps.push(o.material.map); });
  for (let i = 0; i < 600 && !maps.every(t => t.image && t.image.width && (t.image.complete === undefined || t.image.complete)); i++) {
    await new Promise(r => setTimeout(r, 50));
  }
  return obj;
}

// job: { file, idle, react, fps, idleBlend, reactIn, reactOut, yaw, pitch, fov, light, width, height }
// Renders the idle loop and the reaction at job.width × job.height (the bake supersampling) and returns PNG data URLs
// with the projected head points of every frame (the hats follow them) and the ground point.
window.bake = async (job) => {
  const obj = await loadHero(job.file);
  const W = job.width, H = job.height;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;

  const scene = new THREE.Scene();
  obj.traverse(o => {
    if (!o.isMesh) return;
    const map = o.material.map;
    if (map) map.colorSpace = THREE.SRGBColorSpace;
    // Lambert on the albedo, without the model's normal map (it shows blotches): bright, soft, volumetric.
    o.material = new THREE.MeshLambertMaterial({ map });
    o.frustumCulled = false;
  });
  scene.add(obj);
  const L = job.light;
  scene.add(new THREE.HemisphereLight(0xfff6e8, 0xb8a080, L.hemi));
  const key = new THREE.DirectionalLight(0xfff2dc, L.key); key.position.set(-1.2, 2.0, 2.2); scene.add(key);
  const fill = new THREE.DirectionalLight(0xe8f0ff, L.fill); fill.position.set(1.5, 0.6, 1.5); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, L.rim); rim.position.set(0.5, 1.5, -2.0); scene.add(rim);

  const mixer = new THREE.AnimationMixer(obj);
  const clipOf = name => { const c = obj.animations.find(a => a.name === name); if (!c) throw new Error('no clip ' + name + ' in ' + job.file); return c; };
  const idle = clipOf(job.idle), react = clipOf(job.react);
  const aIdle = mixer.clipAction(idle), aRest = mixer.clipAction(idle.clone()), aReact = mixer.clipAction(react);
  for (const a of [aIdle, aRest, aReact]) { a.play(); a.setEffectiveTimeScale(0); }
  const rest = () => 0; // the loop's seam: the idle's first pose
  // Poses one frame: weights of the idle at t, the seam pose, the reaction at t.
  const pose = (wIdle, tIdle, wRest, wReact, tReact) => {
    aIdle.setEffectiveWeight(wIdle); aIdle.time = tIdle;
    aRest.setEffectiveWeight(wRest); aRest.time = rest();
    aReact.setEffectiveWeight(wReact); aReact.time = tReact;
    mixer.update(0);
    obj.updateMatrixWorld(true);
  };

  // The idle loop: the clip, eased into its own first pose over the last idleBlend seconds, so it loops seamlessly.
  const frames = [];
  const nIdle = Math.round(idle.duration * job.fps);
  for (let i = 0; i < nIdle; i++) {
    const t = idle.duration * i / nIdle;
    const w = smooth((t - (idle.duration - job.idleBlend)) / job.idleBlend);
    frames.push({ clip: 'idle', set: () => pose(1 - w, t, w, 0, 0) });
  }
  // The reaction: from the seam pose into the clip over reactIn seconds and back to the seam pose over the last
  // reactOut seconds, so it starts and ends where the idle loop starts.
  const nReact = Math.round(react.duration * job.fps);
  for (let i = 0; i <= nReact; i++) {
    const t = react.duration * i / nReact;
    const w = Math.max(1 - smooth(t / job.reactIn), smooth((t - (react.duration - job.reactOut)) / job.reactOut));
    if (i === nReact) break; // the last pose is the seam: the idle's first frame shows it
    frames.push({ clip: 'react', set: () => pose(0, 0, w, 1 - w, t) });
  }

  // One camera for every frame: the union of the posed bounds, seen from the yaw and the pitch.
  const box = new THREE.Box3();
  for (const f of frames) { f.set(); box.union(new THREE.Box3().setFromObject(obj, true)); }
  const fov = job.fov, yaw = job.yaw * Math.PI / 180, pitch = job.pitch * Math.PI / 180;
  const camera = new THREE.PerspectiveCamera(fov, W / H, 1, 10000);
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  const tan = Math.tan(fov * Math.PI / 360);
  const radius = Math.max(size.y / 2 / tan, size.x / 2 / tan / (W / H), size.z / 2 / tan) * 1.25 + size.length() / 2;
  camera.position.copy(c).addScaledVector(dir, radius);
  camera.lookAt(c);
  camera.updateMatrixWorld(true);

  const bone = name => { let b = null; obj.traverse(o => { if (o.isBone && o.name === name) b = o; }); return b; };
  const head = bone('mixamorigHead'), top = bone('mixamorigHeadTop_End');
  const project = o => { const v = o.getWorldPosition(new THREE.Vector3()).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
  const ground = new THREE.Vector3(0, 0, 0).project(camera);

  // Pass 1: the union of every frame's opaque bounds and the idle's foot line (its lowest solid row at the seam).
  const gl = renderer.getContext();
  const pixels = new Uint8Array(W * H * 4);
  let minX = W, minY = H, maxX = -1, maxY = -1, feet = -1;
  frames.forEach((f, i) => {
    f.set();
    renderer.render(scene, camera);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    for (let y = 0; y < H; y++) {
      const row = (H - 1 - y) * W * 4; // readPixels starts at the bottom
      for (let x = 0; x < W; x++) {
        const a = pixels[row + x * 4 + 3];
        if (a === 0) continue;
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (i === 0 && a >= 128 && y > feet) feet = y;
      }
    }
  });

  // The fit: the hero's ground point at the cell's middle, its seam pose's feet on the foot line, as large as the
  // union of all frames allows inside the margins, its seam pose at most job.fill of the cell high.
  const CW = job.cell[0], CH = job.cell[1], footLine = job.feet * CH, m = job.margin;
  const gx = (ground.x + 1) / 2 * W;
  let seamTop = H;
  { frames[0].set(); renderer.render(scene, camera); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    for (let y = 0; y < H && seamTop === H; y++) { const row = (H - 1 - y) * W * 4; for (let x = 0; x < W; x++) if (pixels[row + x * 4 + 3] > 0) { seamTop = y; break; } } }
  const s = Math.min(
    job.fill * CH / (feet - seamTop),
    (footLine - m * CH) / (feet - minY),
    ((1 - m) * CH - footLine) / Math.max(1, maxY - feet),
    (CW / 2 - m * CW) / Math.max(1, gx - minX),
    (CW / 2 - m * CW) / Math.max(1, maxX - gx));
  const tx = CW / 2 - s * gx, ty = footLine - s * feet;
  const cell = document.createElement('canvas'); cell.width = CW; cell.height = CH;
  const g = cell.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  const toCell = p => [+(p[0] * s + tx).toFixed(2), +(p[1] * s + ty).toFixed(2)];

  // Pass 2: every frame drawn into the cell.
  const out = [];
  for (const f of frames) {
    f.set();
    renderer.render(scene, camera);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, CW, CH);
    g.setTransform(s, 0, 0, s, tx, ty);
    g.drawImage(renderer.domElement, 0, 0);
    out.push({ clip: f.clip, png: cell.toDataURL('image/png'), head: toCell(project(head)), top: toCell(project(top)) });
  }
  renderer.dispose();
  return { frames: out, scale: s, render: [W, H], idleSeconds: idle.duration, reactSeconds: react.duration };
};
window.ready = true;
</script>
</body>
</html>
